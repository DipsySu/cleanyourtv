plugins {
    id 'com.android.application'
}

def launcherProfile = providers.gradleProperty('launcherProfile').getOrElse('')
if (!(launcherProfile in ['', 'johnson'])) throw new GradleException('Unknown launcherProfile: ' + launcherProfile)
def versionCodeText = providers.gradleProperty('launcherVersionCode').getOrElse('6')
if (!(versionCodeText ==~ /[0-9]+/) || !versionCodeText.isInteger() || versionCodeText.toInteger() <= 0) {
    throw new GradleException('launcherVersionCode must be a positive integer')
}
def companyThemeDir = rootProject.file('../theme-packs/johnson-health-tech')
def companyTheme = launcherProfile == 'johnson' ? new groovy.json.JsonSlurper().parse(new File(companyThemeDir, 'manifest.json')) : null
if (companyTheme != null && (companyTheme.id != 'johnson-health-tech' || !(companyTheme.version instanceof Integer) || companyTheme.version <= 0)) {
    throw new GradleException('Invalid company theme manifest')
}
def bundledAssetsDir = layout.buildDirectory.dir('generated/companyThemeAssets')
if (companyTheme != null) {
    def companyThemeZip = tasks.register('companyThemeZip', Zip) {
        from(companyThemeDir) {
            include 'manifest.json', 'config.json', 'preview.jpg', 'banners/**', 'wallpapers/**'
        }
        destinationDirectory = bundledAssetsDir
        archiveFileName = 'company-theme.zip'
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.named('preBuild').configure { dependsOn companyThemeZip }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode versionCodeText.toInteger()
        resValue 'string', 'bundled_theme_id', companyTheme == null ? '' : companyTheme.id
        resValue 'integer', 'bundled_theme_version', companyTheme == null ? '0' : companyTheme.version.toString()
        versionName '2.5'
    }

    if (companyTheme != null) sourceSets.main.assets.srcDir(bundledAssetsDir)

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
