<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>BowFlex</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1A201D;color:#F9F7F1}
body{font-family:"PingFang SC",Arial,sans-serif}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,23,21,.8) 0%,rgba(17,23,21,.57) 21%,rgba(17,23,21,.16) 53%,rgba(17,23,21,.03) 79%),linear-gradient(0deg,rgba(18,24,21,.92),rgba(18,24,21,.6) 20%,transparent 45%,rgba(18,24,21,.13) 69%,rgba(18,24,21,.6))}
.brand{position:absolute;left:120px;top:340px;width:348px}
.jht{display:block;width:172px;height:auto;opacity:.92}
.brand-logo{display:block;width:348px;max-height:123px;object-fit:contain;object-position:left center;filter:brightness(0) invert(1);margin-top:62px}
.category{font-size:27px;letter-spacing:8px;margin-top:28px;color:#EFEDE4}
.company{position:absolute;right:120px;bottom:363px;font-size:22px;letter-spacing:3px;color:rgba(255,255,255,.76)}
</style><body>
<img class="scene" src="../sources/bowflex-product.jpg" alt=""><div class="scrim"></div>
<div class="brand"><img class="jht" src="../sources/logo-white.png" alt="JOHNSON">
<img class="brand-logo" src="../sources/bowflex-logo.png" alt="BowFlex">
<div class="category">居家力量</div></div>
<div class="company">乔山健康科技 · 健康 价值 共享</div>
</body></html>
